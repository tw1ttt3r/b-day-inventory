<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia B</title>
    <script type="module" src="/src/index.mjs"></script>
    <link href="/src/style.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="DIAB-W.svg">
  </head>
  <body class="h-dvh w-full flex flex-col items-center">
    <section class="flex flex-col w-105 sm:px-1 py-4">
      <header class="w-full relative">
        <div id="modalUsAction" class="absolute top-0 right-1">
          <i class="bi bi-chat-heart"></i>
        </div>
        <div class="w-full flex justify-center">
          <img class="w-25" src="DIAB-B.svg" alt="logo-dia-b">
        </div>
      </header>
      <section class="w-full flex justify-end">
        <p id="modalFilterAction" class="flex gap-0.5 text-xs">
          <i class="bi bi-funnel-fill"></i>
          Filtrar
        </p>
      </section>
      <main id="products"></main>
      <footer class="w-full">
        <div class="w-full flex justify-center">
          <span>Día B</span>
          <i class="bi bi-balloon-heart-fill text-red-600"></i>
          <p id="anio"></p>
        </div>
      </footer>
    </section>
    <section class="w-full flex justify-center">
      <dialog id="modalUs" class="w-105 p-1 m-auto rounded backdrop:bg-black/70 relative flex flex-col">
        <div class="absolute top-0 right-0" id="closeModalUsAction">
          <i class="bi bi-x"></i>
        </div>
        <div>
          <p>Es es un mensaje</p>
        </div>
      </dialog>
      <dialog id="modalFilter" class="w-105 p-1 m-auto rounded backdrop:bg-black/70 relative flex flex-col">
        <div class="absolute top-0 right-0" id="closeModalFilterAction">
          <i class="bi bi-x"></i>
        </div>
        <div>
          <p>Estos son filtros</p>
        </div>
      </dialog>
    </section>
  </body>
</html>
